name: CI

# Push no master e todo PR. Nao ha branch protegida ainda; quando houver,
# este e o job para exigir.
on:
  push:
    branches: [master]
  pull_request:

# Um PR que recebe varios pushes seguidos nao precisa terminar as rodadas
# antigas — so a ultima diz alguma coisa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      # O Prisma exige as variaveis DEFINIDAS para gerar o cliente, mas nao
      # conecta em nada durante o `generate` — ele so le o schema. Valor falso
      # e suficiente, e nenhum segredo precisa existir neste job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # A MESMA versao que producao roda: o gateway e `node:22-slim` no
          # Dockerfile, e a Vercel roda 22+.
          #
          # A primeira versao deste arquivo fixava "20.11", o piso declarado em
          # `engines`, com o argumento de que rodar no piso pega uso acidental
          # de API nova. O argumento era bom e o piso e que estava errado: o
          # Vitest 4 importa `styleText` de `node:util`, que so existe a partir
          # do 20.12. O CI quebrou na primeira rodada e provou que o `engines`
          # mentia — nada neste projeto jamais rodou em 20.11.
          #
          # A licao ficou: piso que ninguem exercita vira ficcao. Entao o
          # `engines` passou a declarar `>=22`, que e o que buildamos, rodamos
          # em producao e verificamos aqui.
          node-version: "22"
          cache: npm

      # O `cache: npm` acima guarda `~/.npm`, e o Electron NAO baixa para la —
      # ele usa o proprio diretorio. Sem este passo, sao ~100 MB baixados de
      # novo a cada rodada.
      - name: Cache do binario do Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar
        run: npm ci

      - name: Gerar cliente Prisma
        # NAO e `npm run db:generate`: aquele script passa por `dotenv -e .env`,
        # e o `.env` nao existe no CI (nem deve). Chamando o script do workspace
        # direto, as variaveis do job acima bastam.
        run: npm run generate --workspace=@aether/db

      - name: Typecheck (workspaces)
        run: npm run typecheck

      - name: Typecheck (testes)
        run: npm run typecheck:tests

      - name: Testes
        run: npx vitest run

# O QUE ESTE CI *NAO* COBRE, e vale saber antes de confiar demais nele:
#
# Os `scripts/verify-*.mjs` ficam de fora. Eles sao testes de integracao de
# verdade — precisam do Postgres com dados semeados, do gateway no ar e, no
# caso do `verify-seguranca.mjs`, de duas conexoes simultaneas ao banco. Trazer
# isso para ca pediria subir Postgres e Redis como servicos do job e semear o
# banco a cada rodada. Da para fazer, e nao foi feito nesta rodada; ate la eles
# continuam sendo rodados a mao antes de subir, como esta no README.
#
# Tambem fica de fora o BUILD do `apps/desktop`: o modulo nativo do som e C++
# compilado contra os headers do Electron para Windows, e nao ha runner Windows
# aqui. O que o CI garante do desktop e so o que `game-detect.test.ts` cobre.
#
# E POR QUE O ELECTRON PRECISA SER INSTALADO mesmo o CI nunca abrindo janela:
# `game-detect.js` e `picker.js` fazem `require("electron")` no TOPO do modulo,
# ainda que so usem `app.getFileIcon` la dentro. Importar a logica pura arrasta
# o runtime junto, e o `index.js` do Electron lanca se o binario nao existir.
# Tornar esse require preguicoso deixaria a logica testavel sem o runtime e
# tiraria os 100 MB daqui — e mudanca em codigo de producao do desktop, que nao
# da para verificar neste runner, entao ficou anotada em vez de feita.
