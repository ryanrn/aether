name: CI

# Push no master e todo PR.
#
# FASE 7e — o job `verificar` e o check OBRIGATORIO da branch protection do
# `master` (configurada no GitHub, nao aqui — passo a passo no README › CI ›
# "Branch protection"). Renomear o job quebra a regra em silencio: o GitHub
# passa a esperar um check que nunca mais vai chegar, e todo PR trava em
# "Expected". Quem renomear, atualiza a regra junto.
on:
  push:
    branches: [master]
  pull_request:

# Um PR que recebe varios pushes seguidos nao precisa terminar as rodadas
# antigas — so a ultima diz alguma coisa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    env:
      # O Prisma exige as variaveis DEFINIDAS para gerar o cliente, mas nao
      # conecta em nada durante o `generate` — ele so le o schema. Valor falso
      # e suficiente, e nenhum segredo precisa existir neste job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # A MESMA versao que producao roda: o gateway e `node:22-slim` no
          # Dockerfile, e a Vercel roda 22+.
          #
          # A primeira versao deste arquivo fixava "20.11", o piso declarado em
          # `engines`, com o argumento de que rodar no piso pega uso acidental
          # de API nova. O argumento era bom e o piso e que estava errado: o
          # Vitest 4 importa `styleText` de `node:util`, que so existe a partir
          # do 20.12. O CI quebrou na primeira rodada e provou que o `engines`
          # mentia — nada neste projeto jamais rodou em 20.11.
          #
          # A licao ficou: piso que ninguem exercita vira ficcao. Entao o
          # `engines` passou a declarar `>=22`, que e o que buildamos, rodamos
          # em producao e verificamos aqui.
          node-version: "22"
          cache: npm

      # O `cache: npm` acima guarda `~/.npm`, e o Electron NAO baixa para la —
      # ele usa o proprio diretorio. Sem este passo, sao ~100 MB baixados de
      # novo a cada rodada.
      - name: Cache do binario do Electron
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar
        run: npm ci

      - name: Gerar cliente Prisma
        # NAO e `npm run db:generate`: aquele script passa por `dotenv -e .env`,
        # e o `.env` nao existe no CI (nem deve). Chamando o script do workspace
        # direto, as variaveis do job acima bastam.
        run: npm run generate --workspace=@aether/db

      - name: Typecheck (workspaces)
        run: npm run typecheck

      - name: Typecheck (testes)
        run: npm run typecheck:tests

      - name: Testes
        run: npx vitest run

  # ------------------------------------------------------------------------
  # FASE 7d — a suite de integracao (`scripts/verify-*`) no CI.
  #
  # O job `verificar` acima nao toca banco nem rede. Este sobe Postgres, Redis
  # e um proxy REST-Upstash como servicos, semeia o banco, poe o gateway e o
  # app web no ar e roda a bateria inteira via `scripts/verify-all-ci.mjs`.
  #
  # Separado do `verificar` de proposito: aquele fica em ~80s, sem servicos, e
  # e o "required" da branch protection (fase 7e). Este nao e: uma flaky de
  # infra aqui nao pode travar o merge nem enterrar uma regressao de unidade la.
  # ------------------------------------------------------------------------
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Fala o protocolo REST do Upstash por cima do Redis acima — e o que o
      # `verificar-redis.mts` precisa (o rate limit do app web usa a API REST,
      # nao TCP). Sem isto, aquele script pularia.
      srh:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: ci-upstash-token
          SRH_CONNECTION_STRING: "redis://redis:6379"

    env:
      DATABASE_URL: postgresql://aether:aether@localhost:5432/aether
      DIRECT_URL: postgresql://aether:aether@localhost:5432/aether
      # 48 chars — o gateway exige >= 32. Valor de teste, nenhum segredo real.
      AUTH_SECRET: ci-auth-secret-quarenta-e-oito-caracteres-aqui!!
      REDIS_URL: redis://localhost:6379
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci-upstash-token

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Cache do binario do Electron
        uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar
        run: npm ci

      # A migracao `20260823000000_rls_e_revoke` faz REVOKE de `anon` e
      # `authenticated` — papeis que o Supabase cria e um Postgres cru nao tem.
      # Criados vazios, os REVOKE viram no-op e a migracao aplica limpa.
      - name: Papeis do Supabase (vazios, so para a migracao de RLS)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon; EXCEPTION WHEN duplicate_object THEN null; END $$;
          DO $$ BEGIN CREATE ROLE authenticated; EXCEPTION WHEN duplicate_object THEN null; END $$;
          SQL

      - name: Gerar cliente Prisma
        run: npm run generate --workspace=@aether/db

      - name: Criar as tabelas
        run: npm run deploy --workspace=@aether/db

      - name: Semear
        # seed-ci.mjs importa `@aether/shared` (que resolve para um .ts), entao
        # roda por tsx como o db:seed — `node` nao resolve o import sem extensao.
        run: |
          npm run seed --workspace=@aether/db
          npx tsx scripts/seed-ci.mjs

      - name: Buildar o app web
        # NEXT_PUBLIC_* entra no bundle em tempo de BUILD; sem isto o
        # `verify-phase2` bateria num app apontando para localhost:4000 errado.
        env:
          NEXT_PUBLIC_REALTIME_URL: http://127.0.0.1:4000
        run: npm run build --workspace=@aether/web

      # `--dev` usa chave `devkey` / segredo `secret` fixos. So a API HTTP
      # (7880) importa aqui — o gateway nunca faz WebRTC nos testes.
      # `services:` do Actions nao deixa trocar o comando da imagem; por isso
      # `docker run` num passo em vez de um service.
      - name: Subir LiveKit (dev)
        run: |
          docker run -d --name livekit --network host \
            livekit/livekit-server:v1.8.4 --dev --bind 0.0.0.0

      - name: Bateria de integracao
        timeout-minutes: 12
        run: node scripts/verify-all-ci.mjs

# O QUE ESTE CI *NAO* COBRE, e vale saber antes de confiar demais nele:
#
# O BUILD do `apps/desktop` nao roda AQUI: o modulo nativo do som e C++
# compilado contra os headers do Electron para Windows. Ele mora no
# `desktop.yml` (fase 7e), num runner Windows, so quando o desktop muda.
#
# Os `verify-*-live` que dependem de credencial externa: `verify-igdb-live`
# precisa do par da Twitch. O `verify-igdb` (sem "-live") roda e cobre o
# caminho de fallback + o cache no banco.
#
# O gateway roda em UMA instancia. O `verify-gateway-redis` prova o estado
# 7c-2 entre dois processos, mas a bateria de socket (phases 3-7b) roda contra
# um gateway so. Dois gateways de verdade atras de um balanceador e a fase 7e.
#
# E POR QUE O ELECTRON PRECISA SER INSTALADO mesmo o CI nunca abrindo janela:
# `game-detect.js` e `picker.js` fazem `require("electron")` no TOPO do modulo,
# ainda que so usem `app.getFileIcon` la dentro. Importar a logica pura arrasta
# o runtime junto, e o `index.js` do Electron lanca se o binario nao existir.
# Tornar esse require preguicoso deixaria a logica testavel sem o runtime e
# tiraria os 100 MB daqui — e mudanca em codigo de producao do desktop, que
# ficou anotada em vez de feita. O `desktop.yml` agora daria para verificar,
# mas nao entrou na 7e (itens 1 e 2 sao CI, nao codigo do app).
