<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <!--
      CSP restritiva: esta janela nao carrega NADA da rede. As miniaturas
      chegam como data: URL pelo IPC, e todo o script e local. Sem isto, um
      dia alguem acrescenta um <img src="http://..."> aqui sem pensar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self';"
    />
    <title>Compartilhar tela</title>
    <style>
      /* Mesmos tokens do app (globals.css) — a janela precisa parecer parte dele. */
      :root {
        --base-950: #06070a;
        --base-900: #0d0f14;
        --base-850: #131620;
        --base-800: #191d29;
        --base-700: #232838;
        --base-600: #333a4f;
        --ink-100: #e8eaf0;
        --ink-200: #c9cddb;
        --ink-400: #8b93a8;
        --ink-500: #6b7285;
        --accent-500: #19d3b4;
        --accent-600: #10ab92;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        background: var(--base-950);
        color: var(--ink-100);
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        overflow: hidden;
        /* Selecionar texto aqui nao serve para nada e atrapalha o arraste. */
        user-select: none;
      }

      /* A barra inteira arrasta a janela: ela e frameless. */
      header {
        -webkit-app-region: drag;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 20px 28px 0;
      }

      h1 {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink-100);
        flex-shrink: 0;
      }

      /*
        As abas sao IRMAS do titulo, na mesma linha. Empilhadas em regioes
        separadas com borda entre elas, o topo parecia uma segunda barra de
        titulo sobre a janela.
      */
      nav {
        display: flex;
        gap: 6px;
        -webkit-app-region: no-drag;
      }

      .tab {
        appearance: none;
        background: none;
        border: 0;
        color: var(--ink-400);
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        padding: 10px 2px 14px;
        position: relative;
        transition: color 0.15s ease-out;
      }

      .tab:hover {
        color: var(--ink-200);
      }

      .tab[aria-selected="true"] {
        color: var(--ink-100);
      }

      /*
        Sublinhado de 2px so na aba ativa, colado na borda de baixo do topo.
        E o que faz as duas regioes lerem como uma so: a linha da aba encosta
        no conteudo, em vez de haver uma divisoria atravessando tudo.
      */
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--accent-500);
      }

      .tab .count {
        margin-left: 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-500);
      }

      main {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 20px 28px 24px;
        border-top: 1px solid var(--base-800);
      }

      main::-webkit-scrollbar {
        width: 10px;
      }
      main::-webkit-scrollbar-thumb {
        background: var(--base-700);
        border-radius: 6px;
        border: 3px solid var(--base-950);
      }

      /*
        `auto-fit` no lugar de `auto-fill`, e cards maiores.
        Com `auto-fill` o navegador reserva colunas VAZIAS ate o fim da linha:
        com duas telas numa janela larga, as duas ficavam encolhidas num canto
        e o resto era vazio. `auto-fit` colapsa as colunas que ninguem ocupa, e
        os cards existentes crescem para preencher.
      */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }

      .source {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--base-700);
        border-radius: 10px;
        background: var(--base-900);
        overflow: hidden;
        cursor: pointer;
        padding: 0;
        font: inherit;
        color: inherit;
        text-align: left;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.1s;
      }

      .source:hover {
        border-color: var(--base-600);
        transform: translateY(-1px);
      }

      .source:focus-visible {
        outline: 2px solid var(--accent-500);
        outline-offset: 2px;
      }

      /* Selecionado: o anel de acento, mesma linguagem do "falando" no app. */
      .source[aria-pressed="true"] {
        border-color: var(--accent-600);
        box-shadow:
          0 0 0 1px var(--accent-600),
          0 0 30px -14px var(--accent-500);
      }

      .thumb {
        position: relative;
        aspect-ratio: 16 / 10;
        background: var(--base-950);
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .thumb .empty {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--ink-500);
      }

      .badge {
        position: absolute;
        left: 8px;
        top: 8px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 3px 7px;
        border-radius: 4px;
        border: 1px solid var(--base-700);
        background: rgba(6, 7, 10, 0.82);
        backdrop-filter: blur(4px);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-400);
      }

      .caption {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 14px;
        border-top: 1px solid var(--base-800);
        min-width: 0;
      }

      .caption img {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      .caption span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-200);
      }

      .empty-state {
        padding: 48px 0;
        text-align: center;
        color: var(--ink-500);
        font-size: 13px;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 28px;
        border-top: 1px solid var(--base-800);
        background: var(--base-900);
      }

      .audio {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: var(--ink-200);
        font-size: 14px;
      }

      .audio input {
        accent-color: var(--accent-500);
        width: 17px;
        height: 17px;
        cursor: pointer;
      }

      /* O motivo de a caixa vir desmarcada — so aparece quando houve falha. */
      .audio .hint.aviso {
        color: #c9a96e;
      }

      /*
        Vazia por padrao, entao nao ocupa altura. So aparece quando ha motivo
        de verdade — ver `mostrarMotivo` no renderer.
      */
      .audio .hint {
        display: block;
        font-size: 12px;
        color: var(--ink-500);
        margin-top: 2px;
      }

      .audio .hint:empty {
        display: none;
      }

      .actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }

      button.action {
        border-radius: 7px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.15s,
          border-color 0.15s,
          opacity 0.15s;
      }

      .ghost {
        background: transparent;
        border-color: var(--base-600);
        color: var(--ink-200);
      }

      .ghost:hover {
        background: var(--base-800);
        color: var(--ink-100);
      }

      .primary {
        background: var(--accent-500);
        color: var(--base-950);
        font-weight: 600;
        box-shadow: 0 0 24px -10px var(--accent-500);
      }

      .primary:hover:not(:disabled) {
        background: var(--accent-600);
      }

      .primary:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <!--
      UMA faixa so: titulo e abas na mesma linha.

      Antes eram duas regioes com borda entre elas, e o resultado parecia uma
      segunda barra de titulo empilhada sobre a janela — foi exatamente essa a
      reclamacao. Sem a divisoria, o topo le como um bloco unico.
    -->
    <header>
      <h1>Compartilhar tela</h1>

      <nav>
        <button class="tab" id="tab-screens" role="tab" aria-selected="true">
          Exibicoes <span class="count" id="count-screens"></span>
        </button>
        <button class="tab" id="tab-windows" role="tab" aria-selected="false">
          Aplicativos <span class="count" id="count-windows"></span>
        </button>
      </nav>
    </header>

    <main>
      <div class="grid" id="grid"></div>
      <p class="empty-state" id="empty" hidden>Nada para mostrar aqui.</p>
    </main>

    <footer>
      <label class="audio">
        <input type="checkbox" id="with-audio" checked />
        <span>
          Capturar audio do computador
          <!--
            A dica nasce VAZIA. Ela so ganha texto quando ha um motivo de
            verdade para mostrar — "desligado porque o som falhou em tal
            aparelho". Antes trazia um aviso permanente sobre uma falha que
            quase nunca acontece, e aviso que esta sempre ali deixa de ser lido.
          -->
          <span class="hint"></span>
        </span>
      </label>

      <div class="actions">
        <button class="action ghost" id="cancel">Cancelar</button>
        <button class="action primary" id="confirm" disabled>Compartilhar</button>
      </div>
    </footer>

    <script src="renderer.js"></script>
  </body>
</html>
