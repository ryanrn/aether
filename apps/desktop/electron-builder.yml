# Empacotamento do app desktop.
#
# Instalador NSIS, e nao portable: o app e atualizado varias vezes por semana,
# e portable significaria reenviar o executavel para todo mundo a cada
# correcao. Instalado, ele ganha atalho, icone e caminho para auto-update
# depois.
appId: com.aether.desktop
productName: Aether
copyright: Aether

directories:
  output: dist
  buildResources: build

# Nome SEM a versao, de proposito.
#
# O padrao do electron-builder inclui a versao no arquivo, e ai o link de
# download do site muda a cada release — alguem tem de lembrar de editar o
# site, e quando esquece o botao aponta para uma versao velha ou para o nada.
#
# Com nome fixo, este endereco vale para sempre:
#   github.com/ryanrn/aether-releases/releases/latest/download/Aether-Setup.exe
#
# O atualizador nao se importa: ele le o nome do `latest.yml`, nao adivinha.
artifactName: ${productName}-Setup.${ext}

# Só o que a casca precisa. O app em si vem da rede.
#
# `node_modules` entrou por UMA razao: o `electron-updater` roda DENTRO do app.
# O electron-builder poda sozinho para as dependencias de producao, e a unica
# declarada e ele — o resto continua de fora.
files:
  - src/**/*
  - package.json
  - node_modules/**/*
  # O modulo nativo do som do sistema. So o que roda: o `index.js` e o binario.
  # Fonte, testes e node_modules dele sao coisa de compilacao e ficam de fora.
  - native/index.js
  - native/build/Release/aether_loopback.node

# `.node` NAO carrega de dentro do asar — o Node precisa de um arquivo real no
# disco para o carregador de biblioteca do sistema abrir. Sem esta linha, o
# modulo funciona em desenvolvimento e falha SO no app instalado, que e o pior
# lugar para descobrir.
asarUnpack:
  - native/build/Release/*.node

# Sem estas duas linhas, o electron-builder roda um "install production
# dependencies" no diretorio do app — e num monorepo com workspaces isso PODA o
# node_modules da raiz, levando junto Next, Vitest e Prisma. Aconteceu uma vez.
npmRebuild: false
buildDependenciesFromSource: false

# Para onde o `npm run release` publica, e de onde o app baixa atualizacao.
#
# Repositorio SEPARADO e publico, enquanto o codigo fica privado: release de
# repo privado exige token para baixar, e embutir token num programa
# distribuido e o mesmo que publicar o token.
publish:
  provider: github
  owner: ryanrn
  repo: aether-releases

win:
  target:
    - target: nsis
      arch: [x64]
  # O `.ico` PRONTO, e nao o PNG.
  #
  # Com PNG, o electron-builder chama um conversor proprio que sobe um Node so
  # para isso — e esse processo precisa de memoria contigua para desserializar
  # o V8. Numa maquina ocupada ele morre com "Fatal JavaScript out of memory",
  # e o build inteiro falha por causa de um icone. Aconteceu.
  #
  # O arquivo e versionado e sai de `scripts/gerar-icones.mjs`, com todos os
  # tamanhos que o Windows usa (16 a 256).
  icon: build/icon.ico
  # Sem certificado de assinatura, o Windows mostra "editor desconhecido" na
  # primeira execucao. Isso e esperado e esta anotado nas limitacoes — assinar
  # exige um certificado pago.

nsis:
  # Instalacao por usuario: nao pede senha de administrador.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Aether
  # Desinstalar apaga tambem os dados locais da janela (cookies de sessao).
  deleteAppDataOnUninstall: false
